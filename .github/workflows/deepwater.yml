name: Deepwater daily visuals

on:
  schedule:
    - cron: '23 20 * * *' # 04:23 Asia/Shanghai; GitHub may delay scheduled runs.
  workflow_dispatch:
  push:
    branches: [main, feat/profile-visual-refinement]
    paths:
      - '.github/workflows/deepwater.yml'
      - '.github/profile/**'
      - 'scripts/refresh_dashboard.py'
      - 'scripts/prepare_generated.py'

permissions:
  contents: write

concurrency:
  group: deepwater-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Generate blue contribution city
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile/city.json
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/generated/deepwater-snake.svg?palette=github-dark&color_snake=#b4d2e3&color_dots=#1b2632,#304b62,#4c718d,#739db7,#b4d2e3
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check optional Metrics token
        id: metrics_config
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -n "$METRICS_TOKEN" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Full Metrics awaits METRICS_TOKEN; updating the public-data dashboard instead.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Generate lowlighter metrics
        id: lowlighter_metrics
        if: steps.metrics_config.outputs.enabled == 'true'
        continue-on-error: true
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: deepwater-metrics.svg
          output_action: none
          base: header, activity, community, repositories
          repositories: 30
          repositories_forks: no
          config_timezone: Asia/Shanghai
          config_display: large
          config_animations: yes
          config_padding: 28
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_details: percentage
          plugin_languages_sections: most-used
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: X
          plugin_achievements_limit: 6
          plugin_achievements_only: polyglot, stargazer, developer, scripter, explorer, maintainer
          plugin_activity_visibility: public
          plugins_errors_fatal: yes
          retries: 1
          extras_css: |
            :root {
              --color-text: #e0e6eb;
              --color-text-muted: #97a6b3;
              --color-text-accent: #a8c8da;
              --color-background: #0d1117;
              --color-border: #28313c;
            }
            svg { background: #0d1117; }
            h1, h2, h3, strong { color: #e0e6eb !important; }
      - name: Prepare and validate generated SVGs
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USER: ${{ github.repository_owner }}
          METRICS_OUTCOME: ${{ steps.lowlighter_metrics.outcome }}
        run: |
          python scripts/refresh_dashboard.py
          python scripts/prepare_generated.py
      - name: Commit generated artwork
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/generated
          if git diff --cached --quiet; then
            echo 'Generated assets are already up to date.'
            exit 0
          fi
          git commit -m 'chore(profile): refresh deepwater visuals [skip ci]'
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
