<ellipse cx="170" cy="188" rx="136" ry="16" fill="none" stroke="#7dd3fc" stroke-opacity=".18"/>
<g transform="translate(-16 -12) scale(.65)" filter="url(#shadow)">
<path d="M372 251Q431 217 461 245Q450 281 389 278Z" fill="url(#pearl)"/>
